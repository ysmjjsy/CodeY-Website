# CodeGuys Docker Compose Configuration
#
# Uses external PostgreSQL and Redis. Both must be configured in .env:
#   SQL_DSN=postgresql://user:password@host:5432/database
#   REDIS_CONN_STRING=redis://:password@host:6379/0
#
# Quick Start:
#   docker compose up -d --build
#   Access at http://localhost:3000

services:
  codeguys:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeguys:latest
    container_name: codeguys
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - SQL_DSN=${SQL_DSN:?SQL_DSN must be set in .env}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:?REDIS_CONN_STRING must be set in .env}
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=${NODE_NAME:-codeguys-node-1}
#      - DEFAULT_LANGUAGE=zh-CN  # 默认语言：日志输出，以及对方没有指定语言时返回的提示、邮件和通知；可选 en、zh-CN、zh-TW，不设置为 en
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串
#      - SESSION_COOKIE_SECURE=true  # HTTPS 环境启用；本地 HTTP 使用 false
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin
#      - TRUSTED_PROXIES=172.20.0.0/16  # 反向代理地址或网段
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400
#      - USER_SESSION_REVOKED_RETENTION_DAYS=7
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000
#      - SYNC_FREQUENCY=60
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
