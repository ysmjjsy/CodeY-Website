[workspace]
members = ["server/market-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[workspace.dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["form", "http1", "json", "macros", "multipart", "tokio"] }
base64 = "0.22.1"
blake3 = "1.8.5"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.31"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ring = "0.17.14"
rsa = { version = "0.9.8", features = ["pem", "sha2"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
postgres = "0.19.12"
semver = "1.0.28"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = { version = "0.10.9", features = ["oid"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ulid = { version = "1.2.1", features = ["serde"] }
url = "2.5.8"
yaml-rust2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
type_complexity = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
